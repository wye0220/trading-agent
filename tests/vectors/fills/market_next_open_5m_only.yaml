name: MARKET_NEXT_OPEN：只有 5 分钟线
description: 没有更细的行情时，用跨着激活时刻的那根 5 分钟线的开盘价成交，带 AMBIGUOUS_ENTRY。入场滑点 1 tick。
date: 2025-11-25

slippage: {entry: 1, stop: 0}
market_fill_on_straddle: true
orders:
  - {id: M, side: LONG, type: MARKET_NEXT_OPEN, stop: 4996, target: [OFFSET_FROM_FILL_TICKS, 20], armed: "09:35:05", expires: "09:40:00"}
steps:
  - {bar: {t: "09:35", len: 300, b: [5000, 5002, 4999, 5001]}}
expect:
  events:
    - {kind: ENTRY, order: M, price: 5000.25, flags: [AMBIGUOUS_ENTRY]}
  position: {entry: 5000.25, target: 5005.25}
